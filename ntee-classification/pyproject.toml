[project]
name = "ntee-classification"
version = "0.1.0"
description = "Fine-tune vs. prompt: classifying nonprofit mission statements into NTEE categories with a classic baseline, a prompted frontier model, and a LoRA fine-tuned small open model, compared on accuracy, latency and cost"
requires-python = ">=3.14,<3.15"
# Direct dependencies; exact versions with checksums live in uv.lock. Install with `uv sync`.
# Added by the steps that need them (the dataset builder in step 1, the baseline in step 2, ...). Fine-tuning
# (step 4) runs in Google Colab with its own environment, not here.
dependencies = [
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
lint = [
    "ruff>=0.16",
]
dev = [
    "pytest>=9.0",
    { include-group = "lint" },
]

[tool.uv]
# An application, not a library: install its dependencies, don't build or install it as a package.
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Same rules as the other projects: E/W style, F real bugs, I import order, B likely bugs, UP modern syntax.
select = ["E", "W", "F", "I", "B", "UP"]
