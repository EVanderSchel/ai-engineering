[project]
name = "grant-review-workflow"
version = "0.1.0"
description = "A multi-step agent workflow that reviews nonprofit grant applications on AWS: extraction, classification, research and scoring with Claude on Amazon Bedrock, orchestrated with LangGraph, with durable checkpoints and human review"
requires-python = ">=3.14,<3.15"
# Direct dependencies; exact versions with checksums live in uv.lock. Install with `uv sync`.
# Added by the steps that need them (boto3 for Bedrock in step 2, LangGraph in step 3, ...). The AWS
# infrastructure (step 7) is CDK in TypeScript, with its own package.json, not here.
dependencies = []

[dependency-groups]
lint = [
    "ruff>=0.16",
]
dev = [
    "pytest>=9.0",
    { include-group = "lint" },
]

[tool.uv]
# An application, not a library: install its dependencies, don't build or install it as a package.
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Same rules as the other projects: E/W style, F real bugs, I import order, B likely bugs, UP modern syntax.
select = ["E", "W", "F", "I", "B", "UP"]
