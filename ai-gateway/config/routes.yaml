# Routes: the names clients send as `model`, and the models behind them (design decisions 5 and 7).
# Candidates are tried in order (router.py): a temporary error is retried once, then the next candidate is tried.
# Timeouts are seconds: `first_token` (a stream's first event) and `attempt` (a whole non-streamed answer) are per
# candidate, so a slow one leaves time to fall back; `total` covers every attempt.
#
# Guardrails (step 5): each route's settings are a floor; a team's own settings can only tighten them. The Claude
# routes flag personal data and likely injections (patterns only, free) without changing anything; teams that handle
# untrusted documents switch on blocking or the model judge for themselves (`admin.py team guardrails`).
#
# Bedrock models are called through `us.` inference profiles (requests stay in US Regions). This AWS project has
# Claude 4.x only on Bedrock, so a fallback there can be a different model; the response's `model` says which one.

smart:
  candidates:
    # Claude API's server-side fallback re-runs a refused request on another model in the same call.
    - {provider: anthropic, model: claude-sonnet-5-5, refusal_fallback: true}
    - {provider: bedrock, model: us.anthropic.claude-sonnet-4-6}
  max_tokens_ceiling: 8192
  timeout: {first_token: 20, attempt: 90, total: 120}
  guardrails: {pii_input: flag, injection: flag}

fast:
  candidates:
    - {provider: bedrock, model: us.anthropic.claude-haiku-4-5-20251001-v1:0}
    - {provider: anthropic, model: claude-haiku-4-5}
  max_tokens_ceiling: 4096
  timeout: {first_token: 10, attempt: 30, total: 60}
  guardrails: {pii_input: flag, injection: flag}

# Self-hosted (step 6): Qwen2.5-0.5B-Instruct on llama-server (docker-compose.yml, service `llm`), on this PC's CPU.
# Q8_0: on this CPU it's faster under load than Q4_K_M and as accurate as F16 (results/quantization.md).
# A 0.5B model is for short, simple tasks, not a stand-in for Claude. No fallback: if the server is down, the request
# fails rather than quietly costing money elsewhere. Its timeouts allow for a CPU that may be busy with 4 answers.
local:
  candidates:
    - {provider: local, model: qwen2.5-0.5b-instruct-q8_0}
  max_tokens_ceiling: 1024
  timeout: {first_token: 15, attempt: 60, total: 90}
  guardrails: {pii_input: flag, injection: flag}

# Offline and free: answers by echoing the last message. For local development and load tests.
stub:
  candidates:
    - {provider: stub, model: stub-echo}
  max_tokens_ceiling: 4096
  timeout: {first_token: 5, attempt: 5, total: 10}
