# The EKS cluster for step 11, as eksctl creates it. It lives for a few hours, then eks/down.py removes it.
#
#     uv run python eks/up.py cluster        # eksctl create cluster -f eks/cluster.yaml; about 15-20 minutes
#
# eksctl turns this into two CloudFormation stacks (the VPC and the cluster); deleting the cluster deletes them.
#
# Plain language: the order form for a rented Kubernetes cluster. AWS runs the control plane (the part that schedules
# and remembers everything); EKS Auto Mode adds and removes the machines the pods run on.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: ai-gateway
  region: us-east-2 # the project's Region; every regional resource goes here
  # The newest version in standard support ($0.10 an hour; extended support is $0.60). kubectl 1.36 here can talk
  # to 1.35-1.37. Checked 2026-11-16 with `aws eks describe-cluster-versions`: EKS's default, in standard support
  # with 1.34-1.36.
  version: "1.37"
  tags:
    project: ai-gateway
    step: "11"

# Auto Mode: AWS picks, starts and replaces the nodes (with Karpenter), and runs the EBS storage driver and the load
# balancer controller itself, so nothing is installed for them. Only the general-purpose built-in pool is kept: it
# makes eksctl create the nodes' IAM role, which eks/nodes.yaml reuses. The `system` pool is left out, so no node is
# started just for add-ons.
autoModeConfig:
  enabled: true
  nodePools: [general-purpose]

# No NAT gateway: it would cost more per hour ($0.045 plus traffic) than the node it serves. The nodes go in the
# public subnets with public IPs instead (eks/nodes.yaml), and reach ECR and Docker Hub directly. Nothing listens on
# them from outside: the security group admits only the cluster's own traffic.
vpc:
  nat:
    gateway: Disable

# No add-ons here. metrics-server (for the autoscaler) is added by `eks/up.py nodes` once the public node pool exists:
# created with the cluster, its pods made the built-in pool start two nodes in the private subnets, which without a
# NAT gateway can't reach the Kubernetes API or any registry, so they never join (found on the first run).

# The control plane's own logs go to CloudWatch only when asked; they're not needed for a few hours of measurement.
cloudWatch:
  clusterLogging:
    enableTypes: []
