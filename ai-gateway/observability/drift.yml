# GENERATED by src/drift.py from the eval canary's baselines (results/canary/baselines/): don't edit, regenerate.
#
# The drift monitor's rules (step 9 stage 4). Recording rules hold each (route, prompt)'s expected rates, as the
# canary measured them; the alerts fire when a live rate over the last 1h is more than 10% above
# its expected one, with at least 20 answers in that hour, for 15m. The judge's alert (once
# src/drift_judge.py has graded the canary's answers) fires when the mean grade over 6h is more than
# 0.5 below the canary's, with at least 20 grades, for 30m. Unit-tested with promtool:
# observability/drift_test.yml.
groups:
- name: gateway-drift
  rules:
  - record: gateway:answer_bad_format_ratio:canary
    expr: vector(0.0)
    labels:
      route: fast
      prompt: ntee-classify@v1
  - record: gateway:answer_cut_off_ratio:canary
    expr: vector(0.0)
    labels:
      route: fast
      prompt: ntee-classify@v1
  - record: gateway:judge_score_mean:canary
    expr: vector(4.267)
    labels:
      route: fast
      prompt: ntee-classify@v1
  - record: gateway:answer_bad_format_ratio:canary
    expr: vector(0.05)
    labels:
      route: smart
      prompt: ntee-classify@v1
  - record: gateway:answer_cut_off_ratio:canary
    expr: vector(0.0)
    labels:
      route: smart
      prompt: ntee-classify@v1
  - record: gateway:judge_score_mean:canary
    expr: vector(4.3)
    labels:
      route: smart
      prompt: ntee-classify@v1
  - alert: GatewayAnswerFormatDrift
    expr: |
      (
      sum by (route, prompt) (rate(gateway_answers_total{format="bad"}[1h]))
        / sum by (route, prompt) (rate(gateway_answers_total{format!=""}[1h]))
      )
      > on (route, prompt) (gateway:answer_bad_format_ratio:canary + 0.1)
      and on (route, prompt) sum by (route, prompt) (increase(gateway_answers_total{format!=""}[1h])) >= 20
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: '{{ $value | humanizePercentage }} of answers on route {{ $labels.route }} with prompt {{ $labels.prompt }}
        don''t match its answer format'
      look_at: gateway_answers_total by finish, gateway_fallbacks_total (a fallback model answering?), and recent changes
        to the provider's model; then run the canary (src/canary.py)
  - alert: GatewayAnswersCutOff
    expr: |
      (
      sum by (route, prompt) (rate(gateway_answers_total{format!="",finish="length"}[1h]))
        / sum by (route, prompt) (rate(gateway_answers_total{format!=""}[1h]))
      )
      > on (route, prompt) (gateway:answer_cut_off_ratio:canary + 0.1)
      and on (route, prompt) sum by (route, prompt) (increase(gateway_answers_total{format!=""}[1h])) >= 20
    for: 15m
    labels:
      severity: ticket
    annotations:
      summary: '{{ $value | humanizePercentage }} of answers on route {{ $labels.route }} with prompt {{ $labels.prompt }}
        were cut off by max_tokens'
      look_at: whether the model now thinks or explains before answering (output tokens per request), or callers lowered max_tokens
  - alert: GatewayJudgeScoreDrop
    expr: |
      (
      sum by (route, prompt) (rate(gateway_judge_scores_sum[6h]))
        / sum by (route, prompt) (rate(gateway_judge_scores_count[6h]))
      )
      < on (route, prompt) (gateway:judge_score_mean:canary - 0.5)
      and on (route, prompt) sum by (route, prompt) (increase(gateway_judge_scores_count[6h])) >= 20
    for: 30m
    labels:
      severity: ticket
    annotations:
      summary: the drift judge's mean grade on route {{ $labels.route }} with prompt {{ $labels.prompt }} is {{ $value | printf
        "%.2f" }} of 5, well below the canary's
      look_at: which model answered (gateway_fallbacks_total, the response model), recent provider changes, and the canary
        (src/canary.py); the judge sees a sample, so check gateway_judge_runs_total
