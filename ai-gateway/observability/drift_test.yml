# Unit tests for drift.yml (generated by src/drift.py from the canary's baselines), run by Prometheus's own tool, as
# alerts_test.yml is (CI runs both):
#
#     docker run --rm -v "${PWD}/observability:/w" -w /w --entrypoint promtool prom/prometheus:v3.15.1 test rules drift_test.yml
#
# The expected rates come from the recording rules: route smart with ntee-classify@v1 expects 5% badly formed answers
# (Sonnet explained itself first on 3 of the canary's 60), route fast 0%; neither expects cut-off answers.
rule_files:
  - drift.yml
evaluation_interval: 1m

tests:
  # smart: 30 of every 100 answers badly formed, against 5% expected. Over 15% (5% + the 10-point tolerance), with
  # plenty of answers, so pending at once and firing 15 minutes later. Two replicas, so the rule has to sum them.
  - interval: 1m
    input_series:
      - series: 'gateway_answers_total{instance="a",route="smart",prompt="ntee-classify@v1",finish="stop",format="ok"}'
        values: "0+35x40"
      - series: 'gateway_answers_total{instance="b",route="smart",prompt="ntee-classify@v1",finish="stop",format="ok"}'
        values: "0+35x40"
      - series: 'gateway_answers_total{instance="a",route="smart",prompt="ntee-classify@v1",finish="stop",format="bad"}'
        values: "0+30x40"
      - series: 'gateway_answers_total{instance="a",route="smart",prompt="",finish="stop",format=""}'
        values: "0+500x40" # answers without a registered prompt: not format-checked, not counted
    alert_rule_test:
      - eval_time: 10m
        alertname: GatewayAnswerFormatDrift
        exp_alerts: [] # pending, not firing yet
      - eval_time: 30m
        alertname: GatewayAnswerFormatDrift
        exp_alerts:
          - exp_labels: { severity: ticket, route: smart, prompt: ntee-classify@v1 }
            exp_annotations:
              summary: "30% of answers on route smart with prompt ntee-classify@v1 don't match its answer format"
              look_at: "gateway_answers_total by finish, gateway_fallbacks_total (a fallback model answering?), and recent changes to the provider's model; then run the canary (src/canary.py)"
      - eval_time: 30m
        alertname: GatewayAnswersCutOff
        exp_alerts: []

  # smart at 12% badly formed: above the canary's 5%, but within the tolerance. fast at 5%, against 0% expected:
  # also within it.
  - interval: 1m
    input_series:
      - series: 'gateway_answers_total{route="smart",prompt="ntee-classify@v1",finish="stop",format="ok"}'
        values: "0+88x40"
      - series: 'gateway_answers_total{route="smart",prompt="ntee-classify@v1",finish="stop",format="bad"}'
        values: "0+12x40"
      - series: 'gateway_answers_total{route="fast",prompt="ntee-classify@v1",finish="stop",format="ok"}'
        values: "0+95x40"
      - series: 'gateway_answers_total{route="fast",prompt="ntee-classify@v1",finish="stop",format="bad"}'
        values: "0+5x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: GatewayAnswerFormatDrift
        exp_alerts: []

  # Half of fast's answers badly formed, but only 12 answers in the hour: too few to call it drift.
  - interval: 1m
    input_series:
      - series: 'gateway_answers_total{route="fast",prompt="ntee-classify@v1",finish="stop",format="ok"}'
        values: "0+0.15x40"
      - series: 'gateway_answers_total{route="fast",prompt="ntee-classify@v1",finish="stop",format="bad"}'
        values: "0+0.15x40"
    alert_rule_test:
      - eval_time: 40m
        alertname: GatewayAnswerFormatDrift
        exp_alerts: []

  # fast: 20% of answers cut off by max_tokens (and so badly formed too), against 0% expected: both alerts fire.
  - interval: 1m
    input_series:
      - series: 'gateway_answers_total{route="fast",prompt="ntee-classify@v1",finish="stop",format="ok"}'
        values: "0+80x40"
      - series: 'gateway_answers_total{route="fast",prompt="ntee-classify@v1",finish="length",format="bad"}'
        values: "0+20x40"
    alert_rule_test:
      - eval_time: 30m
        alertname: GatewayAnswersCutOff
        exp_alerts:
          - exp_labels: { severity: ticket, route: fast, prompt: ntee-classify@v1 }
            exp_annotations:
              summary: "20% of answers on route fast with prompt ntee-classify@v1 were cut off by max_tokens"
              look_at: "whether the model now thinks or explains before answering (output tokens per request), or callers lowered max_tokens"
      - eval_time: 30m
        alertname: GatewayAnswerFormatDrift
        exp_alerts:
          - exp_labels: { severity: ticket, route: fast, prompt: ntee-classify@v1 }
            exp_annotations:
              summary: "20% of answers on route fast with prompt ntee-classify@v1 don't match its answer format"
              look_at: "gateway_answers_total by finish, gateway_fallbacks_total (a fallback model answering?), and recent changes to the provider's model; then run the canary (src/canary.py)"

  # The judge (stage 4b): smart's canary mean is 4.3, so the alert fires below 3.8. Two grades a minute averaging
  # 3.5 (half 5s, half 2s, as when half the answers break their format): firing once it has held for 30 minutes.
  - interval: 1m
    input_series:
      - series: 'gateway_judge_scores_count{route="smart",prompt="ntee-classify@v1"}'
        values: "0+2x60"
      - series: 'gateway_judge_scores_sum{route="smart",prompt="ntee-classify@v1"}'
        values: "0+7x60"
    alert_rule_test:
      - eval_time: 20m
        alertname: GatewayJudgeScoreDrop
        exp_alerts: [] # pending
      - eval_time: 45m
        alertname: GatewayJudgeScoreDrop
        exp_alerts:
          - exp_labels: { severity: ticket, route: smart, prompt: ntee-classify@v1 }
            exp_annotations:
              summary: "the drift judge's mean grade on route smart with prompt ntee-classify@v1 is 3.50 of 5, well below the canary's"
              look_at: "which model answered (gateway_fallbacks_total, the response model), recent provider changes, and the canary (src/canary.py); the judge sees a sample, so check gateway_judge_runs_total"

  # A mean of 4.0 on fast (canary 4.27): within the margin. That's also about what the judge gave the canary's
  # wrong answers, so a quiet slide into wrong-but-plausible groups doesn't fire this alert; the canary catches that.
  - interval: 1m
    input_series:
      - series: 'gateway_judge_scores_count{route="fast",prompt="ntee-classify@v1"}'
        values: "0+1x60"
      - series: 'gateway_judge_scores_sum{route="fast",prompt="ntee-classify@v1"}'
        values: "0+4x60"
    alert_rule_test:
      - eval_time: 60m
        alertname: GatewayJudgeScoreDrop
        exp_alerts: []
