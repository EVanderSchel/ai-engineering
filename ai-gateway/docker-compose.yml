# Local PostgreSQL for development and the database tests (step 4). In the Kubernetes cluster (step 8) PostgreSQL runs
# from the Helm chart instead.
#
#     docker compose up -d db        # start (data kept in the gateway-pgdata volume)
#     docker compose down            # stop (add -v to delete the data)
#
# The password comes from .env (gitignored). Published on 127.0.0.1:5433 (5432 is taken by a PostgreSQL installed on
# this PC), on localhost only: nothing outside this PC can reach it.
services:
  db:
    # Official image, pinned by digest so an updated tag can't change the database underneath (update by hand).
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 15
    # Small on purpose: this PC's Docker has about 3.8 GB in all.
    mem_limit: 256m

  # llama-server (llama.cpp's server) running a small self-hosted model, the `local` provider (step 6). Started only
  # when asked for, since it needs a model file in ./models (downloaded by hand, gitignored):
  #
  #     docker compose --profile local up -d llm
  #     $env:LOCAL_MODEL = "qwen2.5-0.5b-instruct-q4_k_m"; docker compose --profile local up -d llm   # another one
  #
  # LOCAL_MODEL is the file's name without .gguf (default Q8_0, the route's model); it is also the model name the server reports, so the usage ledger
  # records which quantization answered.
  llm:
    profiles: [local]
    # Official CPU image, pinned by digest (llama.cpp build 12033). Its default port changed to 9931, so it's set.
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:0b0212befa4facc6fd1e34ee04e19f13b570d0b9ec87d26edf4c402dc0dd636f
    command:
      - --model
      - /models/${LOCAL_MODEL:-qwen2.5-0.5b-instruct-q8_0}.gguf
      - --alias
      - ${LOCAL_MODEL:-qwen2.5-0.5b-instruct-q8_0}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # 4 slots answer at once (continuous batching); the 8192-token context is shared, so 2048 tokens each.
      - --parallel
      - "4"
      - --ctx-size
      - "8192"
      # One thread per physical core of this PC's 4-core CPU: more (hyperthreads) usually slows generation.
      - --threads
      - "4"
      - --metrics
      - --no-webui
    ports:
      # 8081 on this PC: an Apache web server installed here already listens on 8080. Localhost only.
      - "127.0.0.1:8081:8080"
    volumes:
      - ./models:/models:ro
    healthcheck:
      # /health answers 503 while the model loads and 200 once it can serve.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    # Measured peak (results/quantization.md): Q4_K_M 688 MB, Q8_0 836 MB, F16 1399 MB, so F16 needs LOCAL_MEM=2g
    # (src/measure_quantization.py sets it per model).
    mem_limit: ${LOCAL_MEM:-1g}

  # Jaeger: receives the gateway's traces over OTLP and shows them (step 7). Traces are kept in memory, so they're
  # gone when it stops. Start it, then run the gateway with OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318:
  #
  #     docker compose --profile observability up -d jaeger      # UI: http://127.0.0.1:16686
  jaeger:
    profiles: [observability]
    # Official all-in-one image (Jaeger v2, built on the OpenTelemetry Collector), pinned by digest.
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - "127.0.0.1:16686:16686" # the UI
      - "127.0.0.1:4318:4318" # OTLP over HTTP, where the gateway sends spans
    mem_limit: 256m

  # Prometheus: scrapes the gateway's metrics (on this PC, 127.0.0.1:9464) and evaluates observability/alerts.yml.
  #
  #     docker compose --profile observability up -d     # Jaeger, Prometheus and Grafana together
  #     # UI: http://127.0.0.1:9090 (Alerts tab: what's pending and firing)
  prometheus:
    profiles: [observability]
    # Official image, pinned by digest (v3.15.1).
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d # a week of history is plenty locally
    volumes:
      - ./observability:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # built into Docker Desktop; needed on Linux
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m

  # Grafana: the dashboard (observability/grafana/dashboards/gateway.json, generated by make_dashboard.py), with
  # Prometheus and Jaeger as data sources, all provisioned from files. Open to anyone on this PC without logging in,
  # as an editor (to try queries in Explore); it listens on localhost only. The admin password is in .env.
  #
  #     # http://127.0.0.1:3000/d/ai-gateway
  grafana:
    profiles: [observability]
    # Official image, pinned by digest (13.3.0).
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gateway.json
      GF_ANALYTICS_REPORTING_ENABLED: "false" # no usage reports to Grafana Labs
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true" # no plugin downloads and updates from grafana.com at start
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    # Measured: about 320 MB in use with the dashboard open (Prometheus about 130 MB, Jaeger about 25 MB).
    mem_limit: 512m

volumes:
  gateway-pgdata:
  prometheus-data:
