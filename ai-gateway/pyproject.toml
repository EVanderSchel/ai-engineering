[project]
name = "ai-gateway"
version = "0.1.0"
description = "An AI gateway with self-hosted, optimized inference on Kubernetes: one OpenAI-compatible API in front of hosted and self-hosted models, with routing, fallback, per-team limits and budgets, guardrails, cost tracking and observability"
requires-python = ">=3.14,<3.15"
# Direct dependencies; exact versions with checksums live in uv.lock. Install with `uv sync`.
# Added by the steps that need them (the gateway service in step 2, PostgreSQL in step 4, ...).
dependencies = [
    "anthropic>=2.3.0",
    "boto3>=1.43.123",
    "fastapi>=0.120",
    "httpx2>=2.16",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
    "uvicorn>=0.38",
]

[dependency-groups]
lint = [
    "ruff>=0.16",
]
dev = [
    "botocore[crt]>=1.43.123",
    "httpx>=0.28",
    "openai>=3.42.1",
    "pytest>=9.2.0",
    { include-group = "lint" },
    { include-group = "classifier" },
    { include-group = "compare" },
]
# The NTEE classifier on ONNX Runtime (step 6 stage 3); in step 8 it runs as its own service.
classifier = [
    "onnx>=1.23.2",
    "onnx-ir>=1.1.0",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
]
# Step 10 stage 4: a LangChain app run against both gateways (src/langchain_app.py); in dev so CI runs its tests.
compare = [
    "langchain-core==1.7.6",
    "langchain-openai==1.7.4",
]

[tool.uv]
# An application, not a library: install its dependencies, don't build or install it as a package.
package = false

[tool.ruff]
line-length = 120
target-version = "py314"
# The notebook is generated from notebooks/make_export_notebook.py (linted) and checked by tests/test_export_notebook.py.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
# Same rules as the other projects: E/W style, F real bugs, I import order, B likely bugs, UP modern syntax.
select = ["E", "W", "F", "I", "B", "UP"]
