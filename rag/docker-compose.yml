services:
  chroma:
    # Must match the chromadb version pinned in pyproject.toml.
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma-data:/data
    ports:
      # Reachable from this machine only (127.0.0.1), for debugging. Never expose it wider: the Chroma
      # server has a known unauthenticated code-execution vulnerability (PYSEC-2026-311, no fix yet).
      - "127.0.0.1:8001:8000"
    healthcheck:
      # The image has no curl, so use bash's built-in /dev/tcp to call the heartbeat endpoint.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q heartbeat <&3"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      # This machine only: locally the API has no key, so anyone who can reach it spends your credits.
      - "127.0.0.1:8000:8000"
    env_file:
      # Langfuse keys. Optional: without the file the API runs with tracing off.
      - path: .env
        required: false
    environment:
      CHROMA_HOST: chroma # the service name doubles as a hostname on the compose network
      CHROMA_PORT: "8000"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # passed through from your shell, never written here
    volumes:
      - model-cache:/home/appuser/.cache
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  chroma-data:
  model-cache:
