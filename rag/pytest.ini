[pytest]
testpaths = tests
pythonpath = src
# chromadb calls asyncio.iscoroutinefunction, deprecated in Python 3.14 (removal planned for 3.16).
# It's inside chromadb, not our code, so hide only that warning from only that package.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb
