[project]
name = "rag"
version = "1.0.0"
description = "Retrieval-augmented generation service: hybrid search, reranking, Claude answers, evals, Azure deploy"
requires-python = ">=3.14,<3.15"
# Direct dependencies and the version ranges we accept. Exact versions (with checksums) for every
# package, direct or indirect, live in uv.lock; install with `uv sync`. See "Dependencies" in README.md.
dependencies = [
    "chromadb==1.5.9", # must match the chroma server image in docker-compose.yml
    "anthropic>=0.40",
    "sentence-transformers>=3.0",
    "rank_bm25>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langfuse>=4.15",
    "python-dotenv>=1.0",
    "torch>=2.10",
]

[dependency-groups]
lint = [
    "ruff>=0.6",
]
dev = [
    "pytest>=8.0",
    { include-group = "lint" },
]

[tool.uv]
# An application, not a library: install its dependencies, don't build or install it as a package.
package = false

# torch comes from PyTorch's CPU-only index (the PyPI build bundles several GB of CUDA libraries this
# project never uses). "explicit" means this index is used ONLY for packages that name it below, so
# every other package still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (undefined names, unused imports), I: import order,
# B: likely bugs (bugbear), UP: modern syntax for the target Python version.
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# Modules in src/ are imported by bare name (pytest's pythonpath = src), so tell isort they're ours.
known-first-party = ["api", "chunking", "embeddings", "eval", "eval_gate", "eval_generation", "ingest", "model_names",
                     "prompts", "query", "retrieval", "telemetry", "tracing", "vector_store", "download_models",
                     "bench_retrieval"]
