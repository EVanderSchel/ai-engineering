[project]
name = "nonprofit-agent"
version = "0.1.0"
description = "A tool-using agent that researches US charities from public IRS and ProPublica data, built by hand, then with a framework, served over MCP, and evaluated on its trajectories"
requires-python = ">=3.14,<3.15"
# Direct dependencies; exact versions with checksums live in uv.lock. Install with `uv sync`.
# Added by the steps that need them (the tools in step 1, the agent loop in step 2, ...).
dependencies = []

[dependency-groups]
lint = [
    "ruff>=0.16",
]
dev = [
    "pytest>=9.0",
    { include-group = "lint" },
]

[tool.uv]
# An application, not a library: install its dependencies, don't build or install it as a package.
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Same rules as the other projects: E/W style, F real bugs, I import order, B likely bugs, UP modern syntax.
select = ["E", "W", "F", "I", "B", "UP"]
