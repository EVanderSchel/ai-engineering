name: irs-990-extraction CI

# Pull requests always start this workflow, and the `changes` job decides whether irs-990-extraction/ was
# touched. If not, the other jobs are skipped, and GitHub counts a skipped job as passing, so their
# checks can be required on main without blocking pull requests for other projects. (Same pattern as
# rag-ci.yml.)
on:
  push:
    branches: [main]
    paths:
      - "irs-990-extraction/**"
      - ".github/workflows/irs-990-extraction-ci.yml"
  pull_request:
    branches: [main]

# The GITHUB_TOKEN gets read-only access; no job here needs more.
permissions:
  contents: read

jobs:
  changes:
    name: irs-990-extraction-changes
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.filter.outputs.project }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # for a pull request, HEAD is a merge commit; HEAD^1 is the tip of main

      - name: Detect changes to irs-990-extraction/
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main: the paths filter above already decided this workflow is relevant.
            echo "project=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Files changed by this pull request:"
          echo "$changed"
          if grep -qE '^(irs-990-extraction/|\.github/workflows/irs-990-extraction-ci\.yml$)' <<< "$changed"; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: irs-990-extraction-lint
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: irs-990-extraction

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Check lint rules
        run: uv run --frozen --only-group lint ruff check .

      - name: Check formatting
        run: uv run --frozen --only-group lint ruff format --check .

  test:
    name: irs-990-extraction-test
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: irs-990-extraction

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      # Reuse the installed environment while uv.lock is unchanged. The key includes the exact Python
      # version because a virtualenv only works with the interpreter that created it.
      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: irs-990-extraction/.venv
          key: irs-990-venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('irs-990-extraction/uv.lock') }}

      # Exactly what uv.lock specifies, checksums verified. --frozen fails rather than re-resolving if
      # uv.lock is out of date.
      - name: Install dependencies (only when uv.lock changed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Use the environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Run tests
        run: python -m pytest -v

  # Every locked production dependency is checked for known vulnerabilities. Fails on any that isn't
  # listed, with a reason, in irs-990-extraction/security/accepted-vulnerabilities.txt.
  audit:
    name: irs-990-extraction-audit
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: irs-990-extraction

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Audit dependencies
        run: bash security/audit.sh

  # Build the API image and smoke-test it on every pull request, so a broken Dockerfile or a file
  # missing from the image is caught before merging, not after deploying. Not pushed anywhere.
  image:
    name: irs-990-extraction-image
    needs: changes
    if: needs.changes.outputs.project == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: irs-990-extraction
          load: true
          push: false
          tags: irs990-api:pr-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=irs990-api
          cache-to: type=gha,scope=irs990-api,mode=max

      - name: Smoke test the image
        run: bash irs-990-extraction/deploy/smoke_test.sh "irs990-api:pr-${{ github.sha }}" "${{ github.sha }}"

  # After a merge to main passes the checks: build the API image, smoke-test that exact image, then push
  # it to GitHub Container Registry, tagged with the commit SHA (what gets deployed) and "latest".
  publish:
    name: irs-990-extraction-publish
    needs: [lint, test, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/irs990-api" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the runner's Docker first (load, don't push), so the exact image that will be deployed
      # is smoke-tested before anything reaches the registry.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: irs-990-extraction
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=irs990-api
          cache-to: type=gha,mode=max,scope=irs990-api

      - name: Smoke test the image
        run: bash irs-990-extraction/deploy/smoke_test.sh "${{ env.IMAGE_NAME }}:${{ github.sha }}" "${{ github.sha }}"

      # Push the image that was just tested, not a rebuild of it.
      - name: Push image
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

  # Roll the new image out to Azure Container Apps. Waits for your approval (the irs990-production
  # environment requires it), then logs in with OIDC: GitHub gives this job a short-lived token that Azure
  # trusts for this repo's irs990-production environment only, so no Azure password is stored.
  deploy:
    name: irs-990-extraction-deploy
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: irs990-production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      id-token: write # lets the job request the OIDC token
      contents: read

    env:
      RESOURCE_GROUP: rg-irs990-demo
      APP_NAME: ca-irs990-api

    steps:
      - name: Log in to Azure (OIDC, no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy this commit's image
        id: deploy
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/irs990-api:${GITHUB_SHA}"
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "$image" --only-show-errors -o none
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      # /health reports the commit its image was built from, so this confirms the new version is serving,
      # not the old one still answering while Azure switches over. With scale-to-zero, the first call may
      # take ~30 s while a container starts.
      - name: Wait for this commit to be live
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 30); do
            version=$(curl -s --max-time 90 "$URL/health" | python3 -c "import sys, json; print(json.load(sys.stdin).get('version', ''))" 2>/dev/null || true)
            echo "attempt $attempt: live version '${version}'"
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Deployed ${GITHUB_SHA} to $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL never reported version $GITHUB_SHA"
          exit 1
