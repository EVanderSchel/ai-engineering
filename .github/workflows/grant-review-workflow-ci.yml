name: grant-review-workflow CI

# Pull requests always start this workflow, and the `changes` job decides whether grant-review-workflow/ was
# touched. If not, the other jobs are skipped, and GitHub counts a skipped job as passing, so their
# checks can be required on main without blocking pull requests for other projects. (Same pattern as
# rag-ci.yml.)
on:
  push:
    branches: [main]
    paths:
      - "grant-review-workflow/**"
      - ".github/workflows/grant-review-workflow-ci.yml"
  pull_request:
    branches: [main]

# The GITHUB_TOKEN gets read-only access; no job here needs more.
permissions:
  contents: read

jobs:
  changes:
    name: grant-review-workflow-changes
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.filter.outputs.project }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # for a pull request, HEAD is a merge commit; HEAD^1 is the tip of main

      - name: Detect changes to grant-review-workflow/
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main: the paths filter above already decided this workflow is relevant.
            echo "project=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Files changed by this pull request:"
          echo "$changed"
          if grep -qE '^(grant-review-workflow/|\.github/workflows/grant-review-workflow-ci\.yml$)' <<< "$changed"; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: grant-review-workflow-lint
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grant-review-workflow

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"

      - name: Check lint rules
        run: uv run --frozen --only-group lint ruff check .

      - name: Check formatting
        run: uv run --frozen --only-group lint ruff format --check .

  test:
    name: grant-review-workflow-test
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grant-review-workflow

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"

      # Reuse the installed environment while uv.lock is unchanged. The key includes the exact Python
      # version because a virtualenv only works with the interpreter that created it.
      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: grant-review-workflow/.venv
          key: grant-review-workflow-venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('grant-review-workflow/uv.lock') }}

      # Exactly what uv.lock specifies, checksums verified. --frozen fails rather than re-resolving if
      # uv.lock is out of date.
      - name: Install dependencies (only when uv.lock changed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Use the environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Run tests
        run: python -m pytest -v

  # Every locked production dependency is checked for known vulnerabilities. Fails on any that isn't
  # listed, with a reason, in grant-review-workflow/security/accepted-vulnerabilities.txt.
  audit:
    name: grant-review-workflow-audit
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grant-review-workflow

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.21"

      - name: Audit dependencies
        run: bash security/audit.sh

  # The CDK app in infra/: type-check and run the jest tests, which include the cdk-nag checks. The tests build
  # their own app with a fixed test account (test/app.ts), so no AWS credentials are needed; `cdk synth` of the
  # real app (bin/infra.ts) needs an account and only runs in the deploy pipeline. Catching a failing test here
  # stops it before the pipeline's Diff stage, after merge.
  infra:
    name: grant-review-workflow-infra
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grant-review-workflow/infra

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: grant-review-workflow/infra/package-lock.json

      # Exactly what package-lock.json specifies; fails if it's out of date with package.json.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Run tests (including cdk-nag)
        run: npm test

  # Build the Lambda container image to prove it still builds (including the checksum-pinned ADOT layer download),
  # then check the workflow's modules import inside it. Not pushed anywhere: CDK builds and pushes the image it
  # deploys in the pipeline. Layers are cached between runs; pull requests reuse the cache main writes.
  image:
    name: grant-review-workflow-image
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: grant-review-workflow
          load: true
          push: false
          tags: grant-review-workflow:ci-${{ github.sha }}
          cache-from: type=gha,scope=grant-review-workflow-image
          cache-to: type=gha,scope=grant-review-workflow-image,mode=max

      # The image's entrypoint is Lambda's runtime emulator, so run Python directly. Fails if a dependency is
      # missing from the image or a module doesn't import. Lambda puts the layer's /opt/python on the path (that's
      # where opentelemetry-api comes from, see the Dockerfile); a plain `python` doesn't, so it's added here.
      - name: Check the handlers import
        run: |
          docker run --rm --entrypoint python --env PYTHONPATH=/var/task/src:/opt/python \
            "grant-review-workflow:ci-${{ github.sha }}" -c 'import handlers, workflow'
