name: rag CI

on:
  push:
    branches: [main]
    paths:
      - "rag/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "rag/**"
      - ".github/workflows/rag-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: rag/requirements*.txt

      # CPU-only torch first; the default PyPI build pulls several GB of CUDA libraries.
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

  eval-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: rag/requirements*.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements.txt

      # Embedding (Chroma's ONNX MiniLM) and reranker (Hugging Face) models download on first use.
      - name: Cache models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/chroma
            ~/.cache/huggingface
          key: rag-models-v1

      # Fails the job (and so the pull request check) if any score drops below data/eval_baseline.json.
      # The score table also appears on the workflow run's summary page.
      - name: Run retrieval eval gate
        run: python src/eval_gate.py
