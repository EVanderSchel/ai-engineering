name: rag CI

# Pull requests always start this workflow, and the `changes` job decides whether rag/ was touched.
# If not, the other jobs are skipped, and GitHub counts a skipped job as passing. That lets their
# checks be *required* on main without blocking pull requests that only change other projects.
# (A `paths:` filter on pull_request would stop the workflow from starting at all, leaving required
# checks stuck at "Expected - Waiting for status to be reported".)
on:
  push:
    branches: [main]
    paths:
      - "rag/**"
      - ".github/workflows/rag-ci.yml"
  pull_request:
    branches: [main]

# The GITHUB_TOKEN gets read-only access by default; jobs that need more (publishing images, deploying)
# ask for it in their own permissions block. Stating this explicitly means a change to the repository's
# default setting can't silently give every job write access.
permissions:
  contents: read

jobs:
  changes:
    name: rag-changes
    runs-on: ubuntu-latest
    outputs:
      rag: ${{ steps.filter.outputs.rag }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # for a pull request, HEAD is a merge commit; HEAD^1 is the tip of main

      - name: Detect changes to rag/
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main: the paths filter above already decided this workflow is relevant.
            echo "rag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Files changed by this pull request:"
          echo "$changed"
          if grep -qE '^(rag/|\.github/workflows/rag-ci\.yml$)' <<< "$changed"; then
            echo "rag=true" >> "$GITHUB_OUTPUT"
          else
            echo "rag=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: rag-test
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      # Reuse the whole installed environment (torch included) while uv.lock is unchanged: installing
      # it takes about a minute, restoring it a few seconds. The key includes the exact Python version
      # because a virtualenv only works with the interpreter that created it. Both check jobs use the
      # same key, so one saved environment serves both.
      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rag/.venv
          key: rag-venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('rag/uv.lock') }}

      # Exactly what uv.lock specifies, checksums verified, including the dev group (pytest,
      # pip-audit). --frozen fails rather than re-resolving if uv.lock is out of date.
      - name: Install dependencies (only when uv.lock changed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Use the environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Run tests
        run: python -m pytest -v

  eval-gate:
    name: rag-eval-gate
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      # Reuse the whole installed environment (torch included) while uv.lock is unchanged: installing
      # it takes about a minute, restoring it a few seconds. The key includes the exact Python version
      # because a virtualenv only works with the interpreter that created it. Both check jobs use the
      # same key, so one saved environment serves both.
      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rag/.venv
          key: rag-venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('rag/uv.lock') }}

      # Exactly what uv.lock specifies, checksums verified, including the dev group (pytest,
      # pip-audit). --frozen fails rather than re-resolving if uv.lock is out of date.
      - name: Install dependencies (only when uv.lock changed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Use the environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # Embedding (Chroma's ONNX MiniLM) and reranker (Hugging Face) models download on first use.
      - name: Cache models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/chroma
            ~/.cache/huggingface
          key: rag-models-v1

      # Fails the job (and so the pull request check) if any score drops below data/eval_baseline.json.
      # The score table also appears on the workflow run's summary page.
      - name: Run retrieval eval gate
        run: python src/eval_gate.py

  # Required check: ruff lint rules and formatting (configured in rag/pyproject.toml). Installs only the
  # lint dependency group, so it takes seconds.
  lint:
    name: rag-lint
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Check lint rules
        run: uv run --frozen --only-group lint ruff check .

      - name: Check formatting
        run: uv run --frozen --only-group lint ruff format --check .

  # Required check: every locked production dependency is checked for known vulnerabilities. Fails on
  # any that isn't listed, with a reason, in rag/security/accepted-vulnerabilities.txt.
  audit:
    name: rag-audit
    needs: changes
    if: needs.changes.outputs.rag == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"

      - name: Audit dependencies
        run: bash security/audit.sh

  # Required check on pull requests: build the image and smoke-test it, so a broken Dockerfile or a
  # file missing from the image is caught before merging, not in production. Not pushed anywhere.
  # (On main, rag-publish runs the same test on the exact image it's about to push.)
  image:
    name: rag-image
    needs: changes
    if: needs.changes.outputs.rag == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same Dockerfile and layer cache as rag-publish, so this mostly reuses cached layers.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rag
          load: true
          push: false
          tags: rag-api:pr-${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=rag-api

      - name: Smoke test the image
        run: bash rag/deploy/smoke_test.sh "rag-api:pr-${{ github.sha }}" "${{ github.sha }}"

  # After a merge to main passes the checks, build the image and push it to GitHub Container
  # Registry, tagged with the commit SHA (what gets deployed) and "latest" (for convenience).
  publish:
    name: rag-publish
    needs: [test, eval-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rag-api" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Buildx enables the layer cache below: the dependency layers (torch etc.) rarely change, so
      # later builds reuse them instead of reinstalling several GB of packages.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build into the runner's local Docker first (load: true, push: false), so the exact image that
      # will be deployed can be smoke-tested before anything reaches the registry.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: rag
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          # Links the package to this repository on GitHub.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=rag-api
          cache-to: type=gha,mode=max,scope=rag-api

      - name: Smoke test the image
        run: bash rag/deploy/smoke_test.sh "${{ env.IMAGE_NAME }}:${{ github.sha }}" "${{ github.sha }}"

      # Push the image that was just tested, not a rebuild of it.
      - name: Push image
        run: |
          docker push "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

  # Roll the new image out to Azure Container Apps. Waits for your approval (the rag-production
  # environment requires it), then logs in with OIDC: GitHub hands this job a short-lived token that
  # Azure trusts for this repo's rag-production environment only, so no Azure password is stored.
  deploy:
    name: rag-deploy
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: rag-production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      id-token: write # lets the job request the OIDC token
      contents: read

    env:
      RESOURCE_GROUP: rg-rag-demo
      APP_NAME: ca-rag-api

    steps:
      - name: Log in to Azure (OIDC, no stored secret)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy this commit's image
        id: deploy
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/rag-api:${GITHUB_SHA}"
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --image "$image" --only-show-errors -o none
          fqdn=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          echo "url=https://$fqdn" >> "$GITHUB_OUTPUT"

      # /health reports the commit its image was built from, so this confirms the *new* version is
      # serving, not the old one still answering while Azure switches over. The first call may take
      # ~30 s: with scale-to-zero, it starts a container.
      - name: Wait for this commit to be live
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in $(seq 1 30); do
            version=$(curl -s --max-time 90 "$URL/health" | python3 -c "import sys, json; print(json.load(sys.stdin).get('version', ''))" 2>/dev/null || true)
            echo "attempt $attempt: live version '${version}'"
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Deployed ${GITHUB_SHA} to $URL"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL never reported version $GITHUB_SHA"
          exit 1
