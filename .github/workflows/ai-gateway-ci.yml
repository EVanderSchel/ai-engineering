name: ai-gateway CI

# Pull requests always start this workflow, and the `changes` job decides whether ai-gateway/ was
# touched. If not, the other jobs are skipped, and GitHub counts a skipped job as passing, so their
# checks can be required on main without blocking pull requests for other projects. (Same pattern as
# rag-ci.yml.)
on:
  push:
    branches: [main]
    paths:
      - "ai-gateway/**"
      - ".github/workflows/ai-gateway-ci.yml"
  pull_request:
    branches: [main]

# The GITHUB_TOKEN gets read-only access; no job here needs more.
permissions:
  contents: read

jobs:
  changes:
    name: ai-gateway-changes
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.filter.outputs.project }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # for a pull request, HEAD is a merge commit; HEAD^1 is the tip of main

      - name: Detect changes to ai-gateway/
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main: the paths filter above already decided this workflow is relevant.
            echo "project=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Files changed by this pull request:"
          echo "$changed"
          if grep -qE '^(ai-gateway/|\.github/workflows/ai-gateway-ci\.yml$)' <<< "$changed"; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: ai-gateway-lint
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"

      - name: Check lint rules
        run: uv run --frozen --only-group lint ruff check .

      - name: Check formatting
        run: uv run --frozen --only-group lint ruff format --check .

  test:
    name: ai-gateway-test
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway

    # A throwaway PostgreSQL for the database tests, the same image as docker-compose.yml. It lives only for this
    # job and is reachable only from it, so its password is a fixed test value, not a secret.
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: gateway
          POSTGRES_DB: gateway
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"

      # Reuse the installed environment while uv.lock is unchanged. The key includes the exact Python
      # version because a virtualenv only works with the interpreter that created it.
      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ai-gateway/.venv
          key: ai-gateway-venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('ai-gateway/uv.lock') }}

      # Exactly what uv.lock specifies, checksums verified. --frozen fails rather than re-resolving if
      # uv.lock is out of date.
      - name: Install dependencies (only when uv.lock changed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Use the environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

      # REQUIRE_DATABASE makes a missing database fail the database tests instead of skipping them.
      - name: Run tests
        env:
          DATABASE_URL: postgresql://gateway:ci-only-throwaway@127.0.0.1:5432/gateway
          REQUIRE_DATABASE: "1"
        run: python -m pytest -v

      # The alert rules and Prometheus config are code too: checked and unit-tested with Prometheus's own tool, from
      # the same image (pinned by digest) docker-compose.yml runs.
      - name: Check and test the alert rules
        run: |
          promtool() {
            docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool \
              prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 "$@"
          }
          promtool check config prometheus.yml
          promtool test rules alerts_test.yml

  # The eval canary (step 9, ai-gateway/src/canary.py). On every pull request that touches ai-gateway/, it first runs
  # each check on a scripted model (free), then runs the NTEE checks on real models only if their subject changed:
  # a route's candidates in config/routes.yaml, or the prompt version they use. Those runs are compared with the
  # baselines on main (HEAD^1), not with any the pull request commits, and fail if accuracy falls more than the
  # margin. About $0.27 per push when both NTEE checks run; nothing when neither changed. arc-local isn't run here: it
  # needs llama-server and the model file. The runs are uploaded, to commit as the new baselines.
  #
  # Needs a repository secret AI_GATEWAY_CANARY_ANTHROPIC_API_KEY: an Anthropic key used only for this, with a
  # spending limit. There are no AWS credentials here, so the `fast` route's Bedrock candidate fails and it falls
  # back to Haiku 4.5 on the Claude API, the same model, as when the baselines were made.
  canary:
    name: ai-gateway-canary
    needs: changes
    if: needs.changes.outputs.project == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # HEAD^1 is main's tip, where the baselines to compare with are

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"

      - name: Restore Python environment
        id: venv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ai-gateway/.venv
          key: ai-gateway-venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('ai-gateway/uv.lock') }}

      - name: Install dependencies (only when uv.lock changed)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --python "${{ steps.setup-python.outputs.python-path }}"

      - name: Use the environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run the canary on the scripted model
        run: python src/canary.py --stub

      # Fails with a message naming the secret if a check must run and the key isn't set (a fork's pull request
      # gets no secrets).
      - name: Run the canary on real models where a route or prompt changed
        env:
          ANTHROPIC_API_KEY: ${{ secrets.AI_GATEWAY_CANARY_ANTHROPIC_API_KEY }}
        run: python src/canary.py --changed --baseline-ref HEAD^1 ntee-fast ntee-smart

      - name: Upload the runs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-runs
          path: ai-gateway/results/canary/runs/
          if-no-files-found: ignore

  # The container image the cluster runs (step 8): built from the Dockerfile on every change, then started without
  # a database (keys from GATEWAY_KEYS) to show it serves and runs as its non-root user. Built, never pushed.
  image:
    name: ai-gateway-image
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the image
        run: docker build -t ai-gateway:ci .

      - name: Start it and check it serves
        run: |
          docker run -d --name gateway -p 127.0.0.1:8000:8000 -e GATEWAY_KEYS= ai-gateway:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
          test "$(docker exec gateway id -u)" = "10001"   # not root
          docker stop gateway   # a clean shutdown on SIGTERM, as Kubernetes sends
          docker logs gateway 2>&1 | grep -q "Application shutdown complete"
          docker image inspect ai-gateway:ci --format 'image size: {{.Size}} bytes'

      # The Helm chart that runs the image in Kubernetes (helm is on GitHub's Ubuntu runners): it lints, and it renders
      # with the repo's routes file, so a template error fails here rather than at install.
      - name: Lint and render the Helm chart
        run: |
          files="--set-file routes=config/routes.yaml --set-file observability.alerts=observability/alerts.yml"
          files="$files --set-file observability.dashboard=observability/grafana/dashboards/gateway.json"
          helm lint --strict chart/ai-gateway $files
          helm template ai-gateway chart/ai-gateway $files > /dev/null
          helm template ai-gateway chart/ai-gateway --set-file routes=config/routes.yaml \
            --set llm.enabled=false --set observability.enabled=false --set gateway.autoscaling.enabled=false > /dev/null

  # Every locked production dependency is checked for known vulnerabilities. Fails on any that isn't
  # listed, with a reason, in ai-gateway/security/accepted-vulnerabilities.txt.
  audit:
    name: ai-gateway-audit
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-gateway

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.21"

      - name: Audit dependencies
        run: bash security/audit.sh
