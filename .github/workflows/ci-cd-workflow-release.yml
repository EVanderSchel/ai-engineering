name: ci-cd-workflow Release

on:
  push:
    tags:
      - "ci-cd-workflow-v*.*.*"

# The GITHUB_TOKEN gets read-only access by default; jobs that need more (publishing images, deploying)
# ask for it in their own permissions block. Stating this explicitly means a change to the repository's
# default setting can't silently give every job write access.
permissions:
  contents: read

env:
  PROJECT_DIR: ci-cd-workflow

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ env.PROJECT_DIR }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Strip project prefix from tag
        run: echo "VERSION=${GITHUB_REF_NAME#${PROJECT_DIR}-v}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
