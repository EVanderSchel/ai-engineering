name: ci-cd-workflow Release

on:
  push:
    tags:
      - "ci-cd-workflow-v*.*.*"

env:
  PROJECT_DIR: ci-cd-workflow

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ env.PROJECT_DIR }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Strip project prefix from tag
        run: echo "VERSION=${GITHUB_REF_NAME#${PROJECT_DIR}-v}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
