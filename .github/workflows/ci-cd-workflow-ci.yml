name: ci-cd-workflow CI

# Pull requests always start this workflow; the `changes` job skips the checks when ci-cd-workflow/
# wasn't touched, so they can be required on main (skipped counts as passing). See rag-ci.yml.
on:
  push:
    branches: [main]
    paths:
      - "ci-cd-workflow/**"
      - ".github/workflows/ci-cd-workflow-ci.yml"
  pull_request:
    branches: [main]

env:
  PROJECT_DIR: ci-cd-workflow

jobs:
  changes:
    name: ci-cd-workflow-changes
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.filter.outputs.project }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # for a pull request, HEAD is a merge commit; HEAD^1 is the tip of main

      - name: Detect changes to ci-cd-workflow/
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # Push to main: the paths filter above already decided this workflow is relevant.
            echo "project=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Files changed by this pull request:"
          echo "$changed"
          if grep -qE '^(ci-cd-workflow/|\.github/workflows/ci-cd-workflow-ci\.yml$)' <<< "$changed"; then
            echo "project=true" >> "$GITHUB_OUTPUT"
          else
            echo "project=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: ci-cd-workflow-lint
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci-cd-workflow

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check lint rules
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: ci-cd-workflow-test
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ci-cd-workflow

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  build:
    name: ci-cd-workflow-build
    needs: changes
    if: needs.changes.outputs.project == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: false
          tags: ci-cd-workflow-demo:${{ github.sha }}

  publish:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/${{ env.PROJECT_DIR }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging

    steps:
      - name: Trigger Render deploy (staging)
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Trigger Render deploy (production)
        run: curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
