# Dependabot version updates: weekly PRs that move dependencies, GitHub Actions and Docker base images
# to newer versions. (Security fixes arrive separately, as soon as they're published.) Each PR runs the
# usual required checks, so an update that breaks tests, evals or the container smoke test can't merge.
#
# Minor and patch updates are grouped into one PR per ecosystem to keep the noise down; major versions
# get their own PRs, because they're the ones that can break things.
version: 2
updates:
  # rag: pyproject.toml + uv.lock. chromadb is pinned exactly (it must match the Chroma server image in
  # rag/docker-compose.yml), so it only changes when both are updated together by hand.
  - package-ecosystem: uv
    directory: /rag
    schedule:
      interval: weekly
    groups:
      rag-python:
        update-types: [minor, patch]
      # Security fixes in one PR: the audit job fails on any open advisory, so separate PRs each fixing one of
      # several would each fail on the others (#105 and #106).
      rag-security:
        applies-to: security-updates
        patterns: ["*"]

  # pymupdf 2.0 adds ML layout packages (onnxruntime, numpy) that page rendering doesn't use, and would grow the
  # container image; majors are reviewed by hand rather than proposed weekly.
  - package-ecosystem: uv
    directory: /irs-990-extraction
    schedule:
      interval: weekly
    groups:
      irs-990-extraction-python:
        update-types: [minor, patch]
    ignore:
      - dependency-name: pymupdf
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /nonprofit-agent
    schedule:
      interval: weekly
    groups:
      nonprofit-agent-python:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /ntee-classification
    schedule:
      interval: weekly
    groups:
      ntee-classification-python:
        update-types: [minor, patch]

  # pymupdf is pinned below 2 in pyproject.toml for the same reason as irs-990-extraction (see its note above).
  - package-ecosystem: uv
    directory: /grant-review-workflow
    schedule:
      interval: weekly
    groups:
      grant-review-workflow-python:
        update-types: [minor, patch]
    ignore:
      - dependency-name: pymupdf
        update-types: ["version-update:semver-major"]

  # grant-review-workflow's CDK app: package.json + package-lock.json. aws-cdk (the CLI) is pinned exactly in
  # package.json, so Dependabot proposes each new version of it.
  - package-ecosystem: npm
    directory: /grant-review-workflow/infra
    schedule:
      interval: weekly
    groups:
      grant-review-workflow-infra-npm:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ci-cd-workflow
    schedule:
      interval: weekly
    groups:
      ci-cd-workflow-python:
        update-types: [minor, patch]

  # Workflows pin every action to a commit, with the version in a comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  # Base images are pinned by digest; Dependabot also proposes new digests when an image is rebuilt
  # (for example, with OS security patches) under the same tag.
  - package-ecosystem: docker
    directories: [/rag, /ci-cd-workflow, /irs-990-extraction, /grant-review-workflow]
    schedule:
      interval: weekly
    groups:
      docker-images:
        update-types: [minor, patch]
